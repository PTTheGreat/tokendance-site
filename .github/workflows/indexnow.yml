# After each GitHub Pages build, tell IndexNow (Bing, Yandex, Naver, Seznam...)
# about every URL in sitemap.xml so new or changed pages are recrawled quickly.
# The key file 4c64a43bb931d6e6c4edd3412a6bf579.txt at the site root proves ownership.
name: IndexNow

on:
  page_build:
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Submit sitemap URLs
        env:
          HOST: tokendance.life
          KEY: 4c64a43bb931d6e6c4edd3412a6bf579
        run: |
          sleep 30
          urls=$(grep -o '<loc>[^<]*</loc>' sitemap.xml | sed -e 's/<loc>//' -e 's#</loc>##' | jq -R . | jq -sc .)
          body=$(jq -nc --arg host "$HOST" --arg key "$KEY" --argjson urls "$urls" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}')
          echo "$body"
          code=$(curl -sS -o resp.txt -w '%{http_code}' -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' -d "$body")
          cat resp.txt; echo; echo "HTTP $code"
          case "$code" in 200|202) ;; *) exit 1 ;; esac
